packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

# dependency-cruiser loads `typescript` as an optional peer; link the root TS 5.9
# (TypeScript 7 does not ship a JS compiler API yet).
packageExtensions:
  dependency-cruiser:
    peerDependencies:
      typescript: '*'
