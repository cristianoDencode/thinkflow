name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual run of the optional MinIO integration job
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Formatação (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Regras de arquitetura DDD (dependency-cruiser)
        run: pnpm depcruise

      - name: Testes unitários e de integração (com cobertura)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Instalar Chromium (Playwright)
        run: pnpm --filter @thinkflow/web exec playwright install --with-deps chromium

      - name: Testes E2E
        run: pnpm e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Build da imagem Docker
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: thinkflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional (manual): contract test of the S3 adapter against a real MinIO.
  minio-integration:
    name: Contrato S3 com MinIO real (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      MINIO_ROOT_USER: ci-admin
      MINIO_ROOT_PASSWORD: ci-admin-password-not-a-secret
      S3_BUCKET: thinkflow-ci
      S3_ACCESS_KEY_ID: thinkflow-ci
      S3_SECRET_ACCESS_KEY: ci-app-password-not-a-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Subir MinIO e criar bucket/usuário
        run: docker compose --profile minio up -d --wait minio && docker compose --profile minio run --rm minio-init

      - name: Contrato S3
        run: pnpm --filter @thinkflow/server exec vitest run tests/storage/s3-object-store.contract.test.ts
        env:
          RUN_MINIO_TESTS: '1'
          S3_TEST_ENDPOINT: http://127.0.0.1:9000
          S3_TEST_BUCKET: thinkflow-ci
          S3_TEST_ACCESS_KEY_ID: thinkflow-ci
          S3_TEST_SECRET_ACCESS_KEY: ci-app-password-not-a-secret

      - name: Derrubar MinIO
        if: always()
        run: docker compose --profile minio down -v
